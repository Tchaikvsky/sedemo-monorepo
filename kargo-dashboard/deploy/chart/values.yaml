replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/akuity/sedemo-monorepo-kargo-dashboard
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1

ingress:
  # The root domain for the ingress host. The full host will be <namespace>.<root_domain>.
  root_domain: akpdemoapps.link
# Rendered as-is into config.json (see kargo-dashboard/config.example.json for every option).
# The API token is not part of this: it comes from the kargo-token Secret as KARGO_TOKEN.
# Omitting decay.thresholds uses the built-in Good/OK/Bad/Worse defaults.
config:
  kargo:
    url: https://kargo.akpdemoapps.link
    tokenEnv: KARGO_TOKEN
  refreshIntervalSeconds: 30
  projects:
    demo-rollouts:
      displayName: Rollouts Demo
      warehouse: demo-rollouts
    sedemo-app-demo:
      warehouse: sedemo-app-demo
    sedemo-app-oct: 
      warehouse: sedemo-app-oct
    team-ada: 
      warehouses: 
        - akkoma-main
        - akkoma-release
    team-daniel: 
      warehouse: features
    team-eddie: {}
    team-emily: {}
    team-namho: {}
    gatekeeper-stage: {}
    demo-snow: {}
