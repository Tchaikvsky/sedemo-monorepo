apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stable-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: "{{  .Release.Namespace }}.{{ .Values.ingress.root_domain }}"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: dashboard-svc
            port:
              number: 80
  tls:
    - hosts:
        - "{{  .Release.Namespace }}.{{ .Values.ingress.root_domain }}"
      secretName: tls-secret