apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-app
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: dashboard-app
  template:
    metadata:
      labels:
        app: dashboard-app
    spec:
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          name: dashboard-app
          ports:
            - containerPort: 8080
          env:
            - name: KARGO_TOKEN  
              valueFrom:
                secretKeyRef:
                  name: kargo-token      # Name of the K8s Secret
                  key: token     # The key inside that Secret
  minReadySeconds: 30
  