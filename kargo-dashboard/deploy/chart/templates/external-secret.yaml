# GitHub token for demo-ephemeral Kargo http step (posts PR comments)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kargo-token
    template:
      engineVersion: v2
      data:
        token: "{{`{{.token}}`}}"
  data:
  - secretKey: token
    remoteRef:
      key: sedemo/kargo-dashboard
      property: token