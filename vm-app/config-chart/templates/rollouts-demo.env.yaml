{{- /*
Renders /etc/rollouts-demo/rollouts-demo.env (a systemd EnvironmentFile).

Helm (and Kargo's helm-template step) parses every rendered template as YAML
and rejects a bare KEY=VALUE file, so the variables sit in a block scalar
under one key. systemd skips leading whitespace and silently drops lines
without "=", so the same bytes are a valid EnvironmentFile and can be copied
to the VM verbatim.
*/ -}}
rollouts-demo.env: |
  COLOR={{ required "color is required" .Values.color }}
  SEMVER={{ required "semver is required" .Values.semver }}
  STAGE={{ required "stage is required" .Values.stage }}
  NAMESPACE={{ required "namespace is required" .Values.namespace }}
  ERROR_RATE={{ .Values.errorRate | int }}
  LATENCY={{ .Values.latency | int }}
