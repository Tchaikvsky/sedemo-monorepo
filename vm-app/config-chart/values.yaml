# Shared defaults for every stage. Required keys are set by the promotion
# (color, semver, stage) or by the per-stage values file in the platform repo
# (namespace).

# Required. Bubble color; the suffix of the image tag (e.g. "blue" for 50-blue).
color: ""
# Required. The image tag being deployed (e.g. 50-blue).
semver: ""
# Required. Stage name (dev, qa, sit, uat, prod).
stage: ""
# Required per stage, e.g. vm-dev.
namespace: ""

# Percentage (0-100) of /color requests that return an error.
errorRate: 100
# Added response latency for /color requests.
latency: 0
