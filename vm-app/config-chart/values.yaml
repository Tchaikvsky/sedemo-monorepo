# Shared defaults for every stage. Per-stage values files (owned by the
# platform repo) supply the required keys below and may override defaults.

service:
  # Required per stage (set by the promotion, e.g. --set service.stage=dev).
  stage: ""
  listenAddr: ":8080"

pricing:
  feedUrl: https://feeds.navpricing.example/v1/nav
  currency: CAD
  navCutoff: "16:00 ET"
  roundingDecimals: 4

database:
  # Required per stage.
  host: ""
  # Required per stage.
  name: ""
