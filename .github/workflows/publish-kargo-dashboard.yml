name: Publish new image
run-name: Publish new image of kargo-dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'kargo-dashboard/**'
      - '.github/workflows/publish-kargo-dashboard.yml'
permissions:
  packages: write
  attestations: write
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-kargo-dashboard

jobs:
  publish:
    defaults:
      run:
        working-directory: kargo-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: push
        with:
          context: kargo-dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.title="Kargo Dashboard"
            org.opencontainers.image.description="A dashboard summarizing deployed versions across Kargo projects"
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.run_number }}
            org.opencontainers.image.url=${{ github.repositoryUrl }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          annotations: |
            index,manifest:org.opencontainers.image.title="Kargo Dashboard"
            index,manifest:org.opencontainers.image.description="A dashboard summarizing deployed versions across Kargo projects"
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.version=${{ github.run_number }}
            index,manifest:org.opencontainers.image.url=${{ github.repositoryUrl }}
            index,manifest:org.opencontainers.image.source=${{ github.repositoryUrl }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:${{ github.run_number }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  cleanup:
    name: ghcr.io cleanup action
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 5
          exclude-tags: '^pr-'
          delete-ghost-images: true
          delete-orphaned-images: true
          delete-untagged: true
          packages: sedemo-monorepo-kargo-dashboard
