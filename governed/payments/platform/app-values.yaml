# Tenant: payments
# The plain golden path. No extra steps or stages added in this end user's case.

image:
  repository: ghcr.io/akuity/sedemo-monorepo-rollouts-app
  selectionStrategy: NewestBuild
  tagRegex: '^\d*-[a-z]*$'

ingress:
  custom_prefix: payments-gov

rollouts:
  enabled: false

environments:
  staging: true

# Required by the prod policy check (policies/prod-policies.yaml).
labels:
  purpose: payments-api

pipeline:
  prod:
    extraSteps:
    - uses: http
      config:
        method: POST
        url: https://example.com/skip-checks
